<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bonki-Intelligence{% endblock %}</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#242c37;--fg:#e6edf3;--mut:#8b949e;
        --acc:#7c5cff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--acc);text-decoration:none}
  header{display:flex;align-items:center;gap:18px;padding:14px 22px;
         border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header .brand{font-weight:700;letter-spacing:.3px}
  header .brand span{color:var(--acc)}
  header nav{display:flex;gap:16px;margin-left:auto;font-size:14px}
  header nav a{color:var(--mut)} header nav a:hover{color:var(--fg)}
  main{max-width:940px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:16px 18px;margin:0 0 16px}
  .card h2{margin:0 0 12px;font-size:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--mut)} .small{font-size:13px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
        border:1px solid var(--line);color:var(--mut)}
  .pill.ok{color:var(--ok);border-color:#1f6f36} .pill.bad{color:var(--bad);border-color:#7a2620}
  .pill.warn{color:var(--warn);border-color:#6b5211}
  input,select,textarea{background:#0b0f14;border:1px solid var(--line);color:var(--fg);
        border-radius:8px;padding:9px 11px;font:inherit;width:100%}
  label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
  button,.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;
        font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  button.bad{background:#3a1a18;border:1px solid #7a2620;color:#ffb4ae}
  button.sm{padding:5px 10px;font-size:13px}
  table{width:100%;border-collapse:collapse} td,th{padding:8px 6px;border-bottom:1px solid var(--line);
        text-align:left;vertical-align:middle;font-size:14px}
  th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .msg{background:#16241a;border:1px solid #1f6f36;color:#a7f0b8;padding:10px 14px;
       border-radius:8px;margin-bottom:16px}
  code{background:#0b0f14;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .stat{background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px} .stat span{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">Bonki<span>-Intelligence</span></div>
  <nav>
    <a href="/">Groups</a>
    <a href="/settings">Settings</a>
    <a href="/learning">Learning</a>
    <a href="/userbot">User account</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
</header>
<main>
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
